# The Husarion Cockpit installs this project on a robot's user computer from this file
# (husarion-agent's schemas/husarion-project.schema.json, schema 1). The Cockpit's install form
# shows the `env` fields; the stack is compose.mapnav.yaml, which also runs by hand (demo-mapnav.md).
schema: 1
id: husarion-ugv-autonomy
name: Autonomy with Nav2 and slam_toolbox
licence: Apache-2.0
robots: [panther, lynx]
ros_distro: jazzy
architectures: [amd64, arm64]
drives_robot: true
provides: [nav]
needs:
  disk_gb: 12
  ram_gb: 8
  internet: install
  sensors_by_profile:
    obs_pointcloud: [{kind: lidar_3d}]
    obs_laserscan: [{kind: lidar_2d}]
    oak: [{kind: camera}]
profiles:
  hardware:
    compose: [compose.mapnav.yaml]
env:
  - key: ROBOT_NAMESPACE
    from: robot.namespace
  - key: ROBOT_MODEL
    from: robot.model
  - key: OBSERVATION_TOPIC
    label: LiDAR topic
    help: The LaserScan or PointCloud2 topic to read; start the LiDAR first. Its frame must be on the robot (Driver files).
    type: string
    required: true
  - key: OBSERVATION_TYPE
    label: Topic type
    type: choice
    default: pointcloud
    options:
      - {value: pointcloud, label: PointCloud2, compose_profiles: [obs_pointcloud]}
      - {value: laserscan, label: LaserScan, compose_profiles: [obs_laserscan]}
  - key: SENSOR_RANGE
    label: Limit speed to 0.3 m/s
    help: Keep it for a 2D LiDAR, which sees one plane only, and for a LiDAR blind near the robot (Ouster OS2-64, 0.8 m).
    type: choice
    default: os2_64
    options:
      - {value: os2_64, label: "Yes"}
      - {value: os0_32, label: "No"}
  - key: ROBOT_HEIGHT
    label: Robot height in metres
    help: The top of the robot with everything mounted on it. Measure your robot.
    type: string
    default: "0.7"
    required: true
  - key: SLAM
    label: Build a new map
    help: Off, the robot localizes on a saved map and starts where that map was saved.
    type: bool
    default: true
  - key: MAP_NAME
    label: Saved map
    type: string
    required: true
    when: {SLAM: false}
  - key: USE_OAK
    label: Luxonis OAK camera
    help: The OAK's video in the Cockpit. Leave off without an OAK connected.
    type: bool
    default: false
    compose_profiles: [oak]
  - key: OAK_IP
    label: OAK address
    type: string
    default: 10.15.20.6
    when: {USE_OAK: true}
data: [maps, navigator]
status:
  ready_when: compose_healthy
