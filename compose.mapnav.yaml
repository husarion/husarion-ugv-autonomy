# Map-nav: Nav2 with slam_toolbox (or AMCL on a saved map) on the user computer of a Husarion UGV
# running Husarion UGV OS, behind the robot's airlock. See demo-mapnav.md.
#
#   docker compose -f compose.mapnav.yaml up -d
#
# The Ouster LiDAR driver runs here too (demo-mapnav.md). The OAK's video for the Cockpit is two more
# services behind the `oak` profile, off unless `--profile oak` is given (demo-mapnav.md §7).
# Every value below has a default; override it in the shell or in a `.env.mapnav` passed with
# --env-file.

x-common-config: &common-config
  network_mode: host
  ipc: host
  env_file: mapnav.env  # CYCLONEDDS_URI points into ./config/mapnav, so every service mounts it

services:
  ouster:
    image: husarion/ouster:jazzy-map-nav@sha256:f1d681a3294cb2dd1564383380e34a3f352e9105feda0daaff52eb3ad1e7aa20
    <<: *common-config
    volumes:
      - ./config/mapnav:/config/mapnav:ro
    # The robot's URDF places the sensor (components.yaml), so the driver publishes no transform
    # and stamps the cloud in the URDF's lidar frame. Sensor data, best effort.
    command: >
      ros2 launch ouster_ros sensor.composite.launch.xml
        ouster_ns:=${ROBOT_NAMESPACE:-panther}
        sensor_hostname:=${OUSTER_HOSTNAME:-10.15.20.5}
        lidar_mode:=1024x10
        timestamp_mode:=TIME_FROM_ROS_TIME
        proc_mask:=PCL
        pub_static_tf:=false
        sensor_frame:=${ROBOT_NAMESPACE:-panther}/ouster_link
        lidar_frame:=${ROBOT_NAMESPACE:-panther}/os_lidar
        point_cloud_frame:=${ROBOT_NAMESPACE:-panther}/os_lidar
        imu_frame:=${ROBOT_NAMESPACE:-panther}/os_imu
        use_system_default_qos:=false
        persist_config:=false
        attempt_reconnect:=true
        viz:=false

  navigation:
    image: husarion/husarion-ugv-autonomy:jazzy-map-nav-c249ca7@sha256:4746f17ed04ba0a0e0b6fd0b8a6956a0aa6d68f850e4b342b7c2e52ac384688a
    <<: *common-config
    volumes:
      - ./config/mapnav:/config/mapnav:ro
      - ./maps:/maps
    command: >
      ros2 launch husarion_ugv_navigation bringup_launch.py
        namespace:=${ROBOT_NAMESPACE:-panther}
        robot_model:=${ROBOT_MODEL:-panther}
        observation_topic:=${OBSERVATION_TOPIC:-/${ROBOT_NAMESPACE:-panther}/points}
        observation_topic_type:=pointcloud
        lidar_profile:=${LIDAR_PROFILE:-os0_32}
        robot_height:=${ROBOT_HEIGHT:-0.7}
        scan_min_height:=${SCAN_MIN_HEIGHT:-0.25}
        scan_max_height:=${SCAN_MAX_HEIGHT:-1.0}
        use_collision_monitor:=True
        cmd_vel_out:=autonomous/cmd_vel
        slam:=${SLAM:-True}
        map_update_interval:=5.0
        map:=/maps/${MAP_NAME:-map}/map.yaml
        initial_pose_from_sidecar:=True
        use_sim_time:=False

  # The OAK's video for the Cockpit (demo-mapnav.md §7). Off unless asked: `--profile oak`.
  # On-chip H.264 from stock depthai-ros, relayed as CompressedVideo, which the airlock carries
  # through one inbound lane to the robot's camera node. No raw image leaves this computer, and
  # the OAK stays out of navigation.
  oak:
    # depthai-docker map-nav 669ee7e (stock depthai-ros 2.13.0 from apt), amd64 + arm64.
    image: husarion/depthai:jazzy-map-nav@sha256:94d3187841aa6b66d65ca0fcc32152d0990887c670d865c8711d5c33a0a04a27
    profiles: [oak]
    <<: *common-config
    volumes:
      - ./config/mapnav:/config/mapnav:ro
    # The robot's URDF places the OAK (components.yaml, CAM12), so no description or transform is
    # published here: camera_node runs alone, not camera.launch.py. RGB only, encoded on the
    # chip as H.264 baseline (profile 0, no B-frames), published as FFMPEGPacket on
    # oak/rgb/image_raw/compressed. A keyframe every 30 frames: one a second at 30 fps.
    command: >
      ros2 run depthai_ros_driver camera_node --ros-args
        -r __node:=oak
        -r __ns:=/${ROBOT_NAMESPACE:-panther}
        -p camera.i_ip:=${OAK_IP:-10.15.20.6}
        -p camera.i_pipeline_type:=RGB
        -p camera.i_nn_type:=none
        -p camera.i_enable_imu:=false
        -p pipeline_gen.i_enable_imu:=false
        -p camera.i_enable_ir:=false
        -p camera.i_publish_tf_from_calibration:=false
        -p camera.i_restart_on_diagnostics_error:=true
        -p rgb.i_fps:=30.0
        -p rgb.i_low_bandwidth:=true
        -p rgb.i_low_bandwidth_profile:=0
        -p rgb.i_low_bandwidth_bitrate:=${OAK_BITRATE:-3400000}
        -p rgb.i_low_bandwidth_frame_freq:=30
        -p rgb.i_publish_compressed:=true

  # Copies the OAK's FFMPEGPacket into a foxglove_msgs/CompressedVideo on oak/rgb/image_raw/h264,
  # bytes unchanged. The airlock image cannot carry FFMPEGPacket yet; when it can (airlock
  # 1.30.0), remove this service and let the lane carry oak/rgb/image_raw/compressed.
  oak_relay:
    # The relay is in the autonomy image (husarion_ugv_video_relay), the same image as `navigation`.
    image: husarion/husarion-ugv-autonomy:jazzy-map-nav-c249ca7@sha256:4746f17ed04ba0a0e0b6fd0b8a6956a0aa6d68f850e4b342b7c2e52ac384688a
    profiles: [oak]
    <<: *common-config
    volumes:
      - ./config/mapnav:/config/mapnav:ro
    command: >
      ros2 run husarion_ugv_video_relay ffmpeg_to_compressed_video --ros-args
        -r __ns:=/${ROBOT_NAMESPACE:-panther}
        -r input:=oak/rgb/image_raw/compressed
        -r output:=oak/rgb/image_raw/h264
