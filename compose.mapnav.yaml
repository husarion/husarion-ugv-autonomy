# Map-nav: Nav2 with slam_toolbox (or AMCL on a saved map) on the user computer of a Husarion UGV
# running Husarion UGV OS, behind the robot's airlock. See demo-mapnav.md.
#
#   docker compose -f compose.mapnav.yaml --profile ouster up -d     # an Ouster 3D LiDAR
#   docker compose -f compose.mapnav.yaml --profile rplidar up -d    # a Slamtec RPLIDAR S3 or A3
#
# Choose exactly one LiDAR profile; with none, nothing starts. Each profile runs its LiDAR's driver
# and the Nav2 stack fed by it (demo-mapnav.md):
# - `ouster`: the 3D cloud; the stack crops the robot's body out of it and slices it into the 2D
#   scan for SLAM and AMCL, and the costmaps and the collision monitor use the cloud.
# - `rplidar`: an RPLIDAR's 2D scan (RPLIDAR_MODEL a3 or s3) goes straight to SLAM, AMCL, the
#   costmaps and the collision monitor, with no crop box and no slice, at 0.3 m/s at most.
# The OAK's video for the Cockpit is one more service behind the `oak` profile, off unless
# `--profile oak` is given (demo-mapnav.md §7).
# Every value below has a default; override it in the shell or in a `.env.mapnav` passed with
# --env-file.

x-common-config: &common-config
  network_mode: host
  ipc: host
  env_file: mapnav.env  # CYCLONEDDS_URI points into ./config/mapnav, so every service mounts it

services:
  ouster:
    image: husarion/ouster:jazzy-map-nav@sha256:f1d681a3294cb2dd1564383380e34a3f352e9105feda0daaff52eb3ad1e7aa20
    profiles: [ouster]
    <<: *common-config
    volumes:
      - ./config/mapnav:/config/mapnav:ro
    # The robot's URDF places the sensor (components.yaml), so the driver publishes no transform
    # and stamps the cloud in the URDF's lidar frame. Sensor data, best effort.
    command: >
      ros2 launch ouster_ros sensor.composite.launch.xml
        ouster_ns:=${ROBOT_NAMESPACE:-panther}
        sensor_hostname:=${OUSTER_HOSTNAME:-10.15.20.5}
        lidar_mode:=1024x10
        timestamp_mode:=TIME_FROM_ROS_TIME
        proc_mask:=PCL
        pub_static_tf:=false
        sensor_frame:=${ROBOT_NAMESPACE:-panther}/ouster_link
        lidar_frame:=${ROBOT_NAMESPACE:-panther}/os_lidar
        point_cloud_frame:=${ROBOT_NAMESPACE:-panther}/os_lidar
        imu_frame:=${ROBOT_NAMESPACE:-panther}/os_imu
        use_system_default_qos:=false
        persist_config:=false
        attempt_reconnect:=true
        viz:=false

  # Nav2 on the Ouster's cloud (demo-mapnav.md §4).
  navigation:
    image: husarion/husarion-ugv-autonomy:jazzy-map-nav-8f122be@sha256:f8c5da88d849073cb4c3852ec46b130ce060c855d0f3fa79dbfc91228c216c8d
    profiles: [ouster]
    <<: *common-config
    volumes:
      - ./config/mapnav:/config/mapnav:ro
      - ./maps:/maps
    command: >
      ros2 launch husarion_ugv_navigation bringup_launch.py
        namespace:=${ROBOT_NAMESPACE:-panther}
        robot_model:=${ROBOT_MODEL:-panther}
        observation_topic:=${OBSERVATION_TOPIC:-/${ROBOT_NAMESPACE:-panther}/points}
        observation_topic_type:=pointcloud
        lidar_profile:=${LIDAR_PROFILE:-os0_32}
        robot_height:=${ROBOT_HEIGHT:-0.7}
        scan_min_height:=${SCAN_MIN_HEIGHT:-0.25}
        scan_max_height:=${SCAN_MAX_HEIGHT:-1.0}
        use_collision_monitor:=True
        cmd_vel_out:=autonomous/cmd_vel
        slam:=${SLAM:-True}
        map_update_interval:=5.0
        map:=/maps/${MAP_NAME:-map}/map.yaml
        initial_pose_from_sidecar:=True
        use_sim_time:=False

  # A Slamtec RPLIDAR (demo-mapnav.md §8) on the user computer's USB port: RPLIDAR_MODEL a3 (the
  # A3, the default) or s3 (the S3, not tested on a sensor yet). The model sets the serial rate and the scan mode
  # of sllidar_ros2's own launch file for it; a model not listed stops the service at start. The
  # robot's URDF places the sensor (components.yaml: LDR06 for the S3, LDR04 for the A3), so the
  # driver publishes no transform and stamps the scan in the URDF's frame. The scan is /<ns>/scan.
  rplidar:
    # rplidar-docker jazzy 1.0.1 (sllidar_ros2), amd64 + arm64.
    image: husarion/rplidar:jazzy-1.0.1-20260522@sha256:15afa7295060e31e68c49ac45a0fbaad85d87e73e9dd27c1690ab5a46bff3d4e
    profiles: [rplidar]
    <<: *common-config
    environment:
      RPLIDAR_MODEL: ${RPLIDAR_MODEL:-a3}
    volumes:
      - ./config/mapnav:/config/mapnav:ro
    devices:
      - ${RPLIDAR_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0
    command:
      - bash
      - -c
      - |
        case "$$RPLIDAR_MODEL" in
          s3) baud=1000000; mode=DenseBoost ;;
          a3) baud=256000; mode=Sensitivity ;;
          *) echo "RPLIDAR_MODEL must be s3 or a3, not '$$RPLIDAR_MODEL'" >&2; exit 2 ;;
        esac
        echo "RPLIDAR $$RPLIDAR_MODEL: $$baud baud, scan mode $$mode"
        exec ros2 launch /husarion_utils/rplidar.launch.yaml \
          namespace:=${ROBOT_NAMESPACE:-panther} \
          serial_port:=/dev/ttyUSB0 \
          serial_baudrate:=$$baud \
          scan_mode:=$$mode \
          frame_id:=${ROBOT_NAMESPACE:-panther}/${RPLIDAR_FRAME:-laser}

  # Nav2 on the RPLIDAR's scan (either model): observation_topic_type laserscan, so the stack runs no crop box and
  # no slice, and SLAM, AMCL, the costmaps and the collision monitor all read /<ns>/scan.
  # A 2D LiDAR sees one plane only, so linear speed is capped at 0.3 m/s at all times, as for the
  # OS2-64: lidar_profile os2_64 carries that cap. On a scan its other settings (the slice, the
  # crop box, the cloud's frustum) have nothing to act on; the stack also reads the rail height
  # from TF at start. RPLIDAR_SPEED_CAP=os0_32 (a profile with no cap) removes it knowingly; empty
  # or unset keeps it (demo-mapnav.md §8). ros2 launch refuses an empty lidar_profile:=.
  navigation_rplidar:
    image: husarion/husarion-ugv-autonomy:jazzy-map-nav-8f122be@sha256:f8c5da88d849073cb4c3852ec46b130ce060c855d0f3fa79dbfc91228c216c8d
    profiles: [rplidar]
    <<: *common-config
    volumes:
      - ./config/mapnav:/config/mapnav:ro
      - ./maps:/maps
    command: >
      ros2 launch husarion_ugv_navigation bringup_launch.py
        namespace:=${ROBOT_NAMESPACE:-panther}
        robot_model:=${ROBOT_MODEL:-panther}
        observation_topic:=/${ROBOT_NAMESPACE:-panther}/scan
        observation_topic_type:=laserscan
        lidar_profile:=${RPLIDAR_SPEED_CAP:-os2_64}
        use_collision_monitor:=True
        cmd_vel_out:=autonomous/cmd_vel
        slam:=${SLAM:-True}
        map_update_interval:=5.0
        map:=/maps/${MAP_NAME:-map}/map.yaml
        initial_pose_from_sidecar:=True
        use_sim_time:=False

  # The OAK's video for the Cockpit (demo-mapnav.md §7). Off unless asked: `--profile oak`.
  # On-chip H.264 from stock depthai-ros, relayed as CompressedVideo, which the airlock carries
  # through one inbound lane to the robot's camera node. No raw image leaves this computer, and
  # the OAK stays out of navigation. The relay is in the depthai image: when the airlock carries
  # FFMPEGPacket (airlock 1.30.0), it goes from that image's launch file.
  oak:
    # depthai-docker map-nav 93d2782: stock depthai-ros 2.13.0 plus the relay, amd64 + arm64.
    image: husarion/depthai:jazzy-map-nav@sha256:e0824df77b0a223d8ad37766be3e5d29b46e7dc18a9c6bbce5b34f4d774da623
    profiles: [oak]
    <<: *common-config
    volumes:
      - ./config/mapnav:/config/mapnav:ro
    # depthai's camera and the H.264 relay, two components in one container (packets cross
    # in-process). The launch file holds the camera's parameters (demo-mapnav.md §7): RGB only,
    # encoded on the chip as H.264 baseline, a keyframe every 30 frames, no IMU, no IR, and no
    # description or transform (the robot's URDF places the OAK, CAM12). depthai publishes
    # FFMPEGPacket on oak/rgb/image_raw/compressed; the relay, CompressedVideo on
    # oak/rgb/image_raw/h264.
    command: >
      ros2 launch /ros2_ws/launch/oak_h264.launch.py
        namespace:=${ROBOT_NAMESPACE:-panther}
        ip:=${OAK_IP:-10.15.20.6}
        bitrate:=${OAK_BITRATE:-3400000}
