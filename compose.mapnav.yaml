# Map-nav: Nav2 with slam_toolbox (or AMCL on a saved map) on the user computer of a Husarion UGV
# running Husarion UGV OS, behind the robot's airlock. See demo-mapnav.md.
#
# Navigation reads one observation topic, OBSERVATION_TOPIC, and its type picks the profile:
#
#   OBSERVATION_TOPIC=/panther/points \
#     docker compose -f compose.mapnav.yaml --profile obs_pointcloud up -d
#   OBSERVATION_TOPIC=/panther/scan \
#     docker compose -f compose.mapnav.yaml --profile obs_laserscan up -d
#
# - `obs_pointcloud`: a 3D cloud; the stack crops the robot's body out of it and slices it into the
#   2D scan for SLAM and AMCL, and the costmaps and the collision monitor use the cloud.
# - `obs_laserscan`: a 2D scan, turned into a cloud first, so it takes the same crop box (the
#   robot's own posts stand in the scan plane) and a slice wide enough to hold the scan plane.
# With neither profile, navigation does not start. The LiDAR's driver may run anywhere on the
# robot's network; this file can also start one (profiles `ouster` and `rplidar`, below).
# SENSOR_RANGE caps linear speed: os2_64 (the default) at 0.3 m/s at all times, for a 2D LiDAR
# (one plane only) or a LiDAR blind near the robot (OS2-64: 0.8 m); os0_32 removes the cap.
# The OAK's video for the Cockpit is one more service behind the `oak` profile (demo-mapnav.md §7).
#
# The Cockpit installs this project from husarion-project.yaml (its install form sets the
# variables below); it runs the same way by hand. Every value has a default; override it in the
# shell or in an env file passed with --env-file. Nothing here starts by itself, after a boot or
# after a crash: every service is `restart: "no"`. Docker brings an `on-failure` container back
# when its daemon starts if the container's last exit was non-zero, and a shutdown or a power cut
# leaves exactly that. Start the stack again yourself; stop it with `down`. Installed from the
# Cockpit, the project starts after a reboot only when its "Start after reboot" switch is on (off
# by default): the Cockpit's agent starts it then, never Docker.
#
# ROS networking comes from the robot, not from a file in this repo (demo-mapnav.md §4):
# RMW_IMPLEMENTATION, ROS_DOMAIN_ID and ROS_AUTOMATIC_DISCOVERY_RANGE as the robot's Network page
# sets them, and Cyclone's own setting passed inline in CYCLONEDDS_URI (an XML document, no file).
# The default matches the robot's default network profile (factory-hardened-mcast): multicast for
# participant discovery only, the robot's two computers as unicast peers, and this computer's
# interface chosen by its address on the robot's LAN, USER_COMPUTER_ADDRESS (10.15.20.3). Cyclone
# refuses to start when no interface has that address. A robot on a unicast-only profile needs
# another CYCLONEDDS_URI, which the Cockpit's installer renders from the robot's profile.

x-ros-env: &ros-env
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-SUBNET}
  CYCLONEDDS_URI: '${CYCLONEDDS_URI:-<CycloneDDS><Domain Id="any"><General><Interfaces><NetworkInterface address="${USER_COMPUTER_ADDRESS:-10.15.20.3}"/></Interfaces><AllowMulticast>spdp</AllowMulticast><EnableMulticastLoopback>true</EnableMulticastLoopback></General><Discovery><ParticipantIndex>auto</ParticipantIndex><MaxAutoParticipantIndex>30</MaxAutoParticipantIndex><Peers><Peer Address="10.15.20.2"/><Peer Address="10.15.20.3"/></Peers></Discovery></Domain></CycloneDDS>}'

# "Healthy" means the service's ROS processes are alive. The checks read /proc only: a `ros2` CLI
# call would join the ROS graph on every check, and the robot's airlock pays for each newcomer.
# The `[x]` in a pattern keeps grep from matching its own command line.
x-health: &health
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 60s

x-common-config: &common-config
  network_mode: host
  ipc: host
  restart: "no"
  # ros2 launch as PID 1 ignores docker's SIGTERM, so Stop (`down`) waited 10 s and killed it
  stop_signal: SIGINT
  environment: *ros-env

services:
  ouster:
    image: husarion/ouster:jazzy-map-nav@sha256:f1d681a3294cb2dd1564383380e34a3f352e9105feda0daaff52eb3ad1e7aa20
    profiles: [ouster]
    <<: *common-config
    # The robot's URDF places the sensor (components.yaml), so the driver publishes no transform
    # and stamps the cloud in the URDF's lidar frame. Sensor data, best effort.
    command:
      - ros2
      - launch
      - ouster_ros
      - sensor.composite.launch.xml
      - ouster_ns:=${ROBOT_NAMESPACE:-panther}
      - sensor_hostname:=${OUSTER_HOSTNAME:-10.15.20.5}
      - lidar_mode:=1024x10
      - timestamp_mode:=TIME_FROM_ROS_TIME
      - proc_mask:=PCL
      - pub_static_tf:=false
      - sensor_frame:=${ROBOT_NAMESPACE:-panther}/ouster_link
      - lidar_frame:=${ROBOT_NAMESPACE:-panther}/os_lidar
      - point_cloud_frame:=${ROBOT_NAMESPACE:-panther}/os_lidar
      - imu_frame:=${ROBOT_NAMESPACE:-panther}/os_imu
      - use_system_default_qos:=false
      - persist_config:=false
      - attempt_reconnect:=true
      - viz:=false
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "grep -qa '__node:=os_drive[r]' /proc/[0-9]*/cmdline"]

  # Nav2 on a 3D cloud (demo-mapnav.md §4), with the Cockpit's map gateway: the map, the pose,
  # the plan, pause and resume and the saved maps (in ./maps) for the Operate map.
  navigation:
    image: husarion/husarion-ugv-autonomy:jazzy-map-nav-8a734db@sha256:b022d63c023ccd5fe3521f046c41fe72dbc18656626cff437231a4a28b693013
    profiles: [obs_pointcloud]
    <<: *common-config
    volumes:
      - ./maps:/maps
    command:
      - ros2
      - launch
      - husarion_ugv_navigation
      - bringup_launch.py
      - namespace:=${ROBOT_NAMESPACE:-panther}
      - robot_model:=${ROBOT_MODEL:-panther}
      - observation_topic:=${OBSERVATION_TOPIC:-/${ROBOT_NAMESPACE:-panther}/points}
      - observation_topic_type:=pointcloud
      - lidar_profile:=${SENSOR_RANGE:-os2_64}
      - robot_height:=${ROBOT_HEIGHT:-0.7}
      - scan_min_height:=${SCAN_MIN_HEIGHT:-0.25}
      - scan_max_height:=${SCAN_MAX_HEIGHT:-1.0}
      - use_collision_monitor:=True
      - cmd_vel_out:=autonomous/cmd_vel
      - use_map_gateway:=True
      - slam:=${SLAM:-True}
      - map_update_interval:=5.0
      - map:=/maps/${MAP_NAME:-map}/map.yaml
      - initial_pose_from_sidecar:=True
      - use_sim_time:=False
    healthcheck: &nav-health
      <<: *health
      test:
        - CMD-SHELL
        # Nav2 runs composed in nav2_container (the collision monitor too), beside the gateway.
        - >-
          grep -qa '__node:=nav2_containe[r]' /proc/[0-9]*/cmdline &&
          grep -qa '__node:=map_gatewa[y]' /proc/[0-9]*/cmdline

  # A Slamtec RPLIDAR (demo-mapnav.md §8) on the user computer's USB port, started here only when
  # asked (`--profile rplidar`; the install form's LIDAR_DRIVER). RPLIDAR_MODEL a3 (the default) or
  # s3 sets the serial rate and the scan mode; a model not listed stops the service at start.
  # RPLIDAR_DEVICE is the serial port (prefer /dev/serial/by-id/...). The robot's URDF places the
  # sensor (components.yaml: LDR04 for the A3, LDR06 for the S3), so the driver publishes
  # no transform and stamps the scan in the URDF's frame. Its scan is /<ns>/rplidar/scan. The
  # values reach the script as environment variables, never as script text.
  rplidar:
    # rplidar-docker jazzy 1.0.1 (sllidar_ros2), amd64 + arm64.
    image: husarion/rplidar:jazzy-1.0.1-20260522@sha256:15afa7295060e31e68c49ac45a0fbaad85d87e73e9dd27c1690ab5a46bff3d4e
    profiles: [rplidar]
    <<: *common-config
    environment:
      <<: *ros-env
      RPLIDAR_MODEL: ${RPLIDAR_MODEL:-a3}
      RPLIDAR_NS: ${ROBOT_NAMESPACE:-panther}
      RPLIDAR_FRAME: ${RPLIDAR_FRAME:-laser}
    devices:
      - ${RPLIDAR_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0
    command:
      - bash
      - -c
      - |
        case "$$RPLIDAR_MODEL" in
          s3|rplidar_s3) baud=1000000; mode=DenseBoost ;;
          a3|rplidar_a3) baud=256000; mode=Sensitivity ;;
          *) echo "RPLIDAR_MODEL must be s3 or a3, not '$$RPLIDAR_MODEL'" >&2; exit 2 ;;
        esac
        echo "RPLIDAR $$RPLIDAR_MODEL: $$baud baud, scan mode $$mode"
        exec ros2 launch /husarion_utils/rplidar.launch.yaml \
          "namespace:=$$RPLIDAR_NS/rplidar" \
          serial_port:=/dev/ttyUSB0 \
          "serial_baudrate:=$$baud" \
          "scan_mode:=$$mode" \
          "frame_id:=$$RPLIDAR_NS/$$RPLIDAR_FRAME"
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "grep -qa 'sllidar_nod[e]' /proc/[0-9]*/cmdline"]

  # A 2D scan (OBSERVATION_TOPIC) as a point cloud on /<ns>/observation/points, in the scan's own
  # frame, so the 2D path runs through the same crop box and slice as a 3D cloud: the crop box drops
  # the robot itself (the DEV09's posts stand in the scan plane, inside the footprint), and the
  # slice makes /<ns>/scan for SLAM and AMCL.
  scan_cloud:
    image: husarion/husarion-ugv-autonomy:jazzy-map-nav-8a734db@sha256:b022d63c023ccd5fe3521f046c41fe72dbc18656626cff437231a4a28b693013
    profiles: [obs_laserscan]
    <<: *common-config
    command:
      - ros2
      - run
      - pointcloud_to_laserscan
      - laserscan_to_pointcloud_node
      - --ros-args
      - -r
      - __ns:=/${ROBOT_NAMESPACE:-panther}
      - -r
      - scan_in:=${OBSERVATION_TOPIC:-/${ROBOT_NAMESPACE:-panther}/rplidar/scan}
      - -r
      - cloud:=observation/points
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "grep -qa 'laserscan_to_pointcloud_nod[e]' /proc/[0-9]*/cmdline"]

  # Nav2 on a 2D scan's cloud: the crop box drops everything inside the footprint up to
  # ROBOT_HEIGHT, the slice (0.05 m to 2.0 m, so the scan plane is in it wherever the sensor is
  # mounted) feeds SLAM and AMCL, and the costmaps and the collision monitor read the cropped cloud.
  # A 2D LiDAR sees one plane only: keep SENSOR_RANGE os2_64 (0.3 m/s at most) unless you know the
  # path is clear above and below that plane. ros2 launch refuses an empty lidar_profile:=. The
  # preflight checks the scan the user gave, not the converted cloud.
  navigation_scan:
    image: husarion/husarion-ugv-autonomy:jazzy-map-nav-8a734db@sha256:b022d63c023ccd5fe3521f046c41fe72dbc18656626cff437231a4a28b693013
    profiles: [obs_laserscan]
    <<: *common-config
    volumes:
      - ./maps:/maps
    command:
      - ros2
      - launch
      - husarion_ugv_navigation
      - bringup_launch.py
      - namespace:=${ROBOT_NAMESPACE:-panther}
      - robot_model:=${ROBOT_MODEL:-panther}
      - observation_topic:=/${ROBOT_NAMESPACE:-panther}/observation/points
      - observation_topic_type:=pointcloud
      - lidar_profile:=${SENSOR_RANGE:-os2_64}
      - robot_height:=${ROBOT_HEIGHT:-0.7}
      - scan_min_height:=0.05
      - scan_max_height:=2.0
      - use_collision_monitor:=True
      - cmd_vel_out:=autonomous/cmd_vel
      - use_map_gateway:=True
      - slam:=${SLAM:-True}
      - map_update_interval:=5.0
      - map:=/maps/${MAP_NAME:-map}/map.yaml
      - initial_pose_from_sidecar:=True
      - use_sim_time:=False
    healthcheck: *nav-health

  # The OAK's video for the Cockpit (demo-mapnav.md §7). Off unless asked: `--profile oak`.
  # On-chip H.264 from stock depthai-ros as FFMPEGPacket, which the airlock (1.30.0 and later)
  # carries through one inbound lane to the robot's camera node. No raw image leaves this
  # computer, and the OAK stays out of navigation.
  oak:
    # depthai-docker map-nav 8368f8b: stock depthai-ros 2.13.0, amd64 + arm64.
    # Published by CI from that commit on 2026-11-22; /ros2_ws holds only the launch file.
    image: husarion/depthai:jazzy-map-nav@sha256:259980585b5411497459711989edd952d0036c40c133e7aae09b11b00fdca25b
    profiles: [oak]
    <<: *common-config
    # depthai's camera as a component. The launch file holds its parameters (demo-mapnav.md §7):
    # RGB only, encoded on the chip as H.264 baseline, a keyframe every 30 frames, no IMU, no IR,
    # and no description or transform (the robot's URDF places the OAK, CAM12). depthai publishes
    # FFMPEGPacket on oak/rgb/image_raw/compressed.
    command:
      - ros2
      - launch
      - /ros2_ws/launch/oak_h264.launch.py
      - namespace:=${ROBOT_NAMESPACE:-panther}
      - ip:=${OAK_IP:-10.15.20.6}
      - bitrate:=${OAK_BITRATE:-3400000}
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "grep -qa '__node:=oak_containe[r]' /proc/[0-9]*/cmdline"]
